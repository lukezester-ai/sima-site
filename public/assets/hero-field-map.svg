<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="AgriNexus Geo drone precision field scanning map">
  <defs>
    <linearGradient id="fieldA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d8a3a" />
      <stop offset="100%" stop-color="#3f6826" />
    </linearGradient>
    <linearGradient id="fieldB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a9c4a" />
      <stop offset="100%" stop-color="#5b7c30" />
    </linearGradient>
    <linearGradient id="fieldC" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a78a4f" />
      <stop offset="100%" stop-color="#7a5f31" />
    </linearGradient>
    <linearGradient id="fieldD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9bbe5b" />
      <stop offset="100%" stop-color="#6f9438" />
    </linearGradient>
    <linearGradient id="targetField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9" />
    </linearGradient>

    <!-- Laser/Lidar SCAN BEAM gradient -->
    <linearGradient id="scanBeam" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="rotorSpin" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.45)" />
      <stop offset="70%" stop-color="rgba(52, 211, 153, 0.25)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0)" />
    </radialGradient>

    <pattern id="grain" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="transparent" />
      <rect x="0" y="0" width="1" height="1" fill="rgba(255,255,255,0.06)" />
      <rect x="2" y="2" width="1" height="1" fill="rgba(0,0,0,0.08)" />
    </pattern>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="60%" stop-color="rgba(0,0,0,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.32)" />
    </radialGradient>

    <radialGradient id="nodePulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(228,170,40,0.95)" />
      <stop offset="60%" stop-color="rgba(228,170,40,0.25)" />
      <stop offset="100%" stop-color="rgba(228,170,40,0)" />
    </radialGradient>
  </defs>

  <!-- Background and Base Fields -->
  <rect width="600" height="400" fill="#2b4620" />
  <polygon points="0,0 240,0 200,180 0,210" fill="url(#fieldA)" />
  <polygon points="240,0 600,0 600,150 320,170 200,180" fill="url(#fieldB)" />
  <polygon points="0,210 200,180 230,400 0,400" fill="url(#fieldD)" />
  <polygon points="320,170 600,150 600,400 360,400 270,300" fill="url(#fieldC)" />

  <!-- Field Roads / Boundaries -->
  <path d="M0,210 L200,180 L320,170 L600,150" stroke="#caa56a" stroke-width="3.5" fill="none" opacity="0.85" />
  <path d="M270,300 L360,400" stroke="#caa56a" stroke-width="3" fill="none" opacity="0.8" />
  <path d="M230,400 L240,260 L320,170" stroke="#b8965e" stroke-width="2" fill="none" opacity="0.7" stroke-dasharray="4 6" />

  <!-- Agricultural Rows Grid Overlay -->
  <g opacity="0.18" stroke="#1f3a10" stroke-width="0.6">
    <path d="M20,40 L260,40" /><path d="M20,55 L260,55" /><path d="M20,70 L260,70" />
    <path d="M20,85 L260,85" /><path d="M20,100 L260,100" /><path d="M20,115 L260,115" />
    <path d="M20,130 L260,130" /><path d="M20,145 L260,145" /><path d="M20,160 L260,160" />
  </g>
  <g opacity="0.2" stroke="#042217" stroke-width="0.7">
    <path d="M270,210 L580,205" /><path d="M270,225 L580,220" /><path d="M270,240 L580,235" />
    <path d="M270,255 L580,250" /><path d="M270,270 L580,265" /><path d="M270,285 L580,280" />
    <path d="M270,300 L580,295" /><path d="M270,315 L580,310" /><path d="M270,330 L580,325" />
    <path d="M270,345 L580,340" /><path d="M270,360 L580,355" /><path d="M270,375 L580,370" />
  </g>

  <!-- Target Monitored Precision Field -->
  <polygon
    points="245,225 470,200 510,330 360,365 250,310"
    fill="url(#targetField)"
    stroke="#34d399"
    stroke-width="3"
    stroke-dasharray="8 5"
    opacity="0.95"
  />

  <!-- Field Telemetry Target Grid -->
  <g opacity="0.4">
    <line x1="295" y1="200" x2="295" y2="350" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="245" y1="265" x2="480" y2="265" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="295" cy="265" r="45" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- DRONE FLIGHT PATH -->
  <path d="M60,60 Q180,110 260,150 T365,160" stroke="#dfa41f" stroke-width="2.5" fill="none" stroke-dasharray="6 4" opacity="0.9" />
  <circle cx="60" cy="60" r="5" fill="#dfa41f" stroke="#042217" stroke-width="2" />
  <circle cx="200" cy="125" r="3.5" fill="#dfa41f" />
  <circle cx="280" cy="153" r="3.5" fill="#dfa41f" />

  <!-- LIDAR / LASER SCAN BEAM FROM DRONE (X:365, Y:160) DOWN TO FIELD (center X:365, Y:275) -->
  <polygon points="365,160 260,285 470,265" fill="url(#scanBeam)" opacity="0.85" />
  <line x1="365" y1="160" x2="260" y2="285" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  <line x1="365" y1="160" x2="470" y2="265" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  <!-- Scan Laser Line on Ground -->
  <line x1="260" y1="285" x2="470" y2="265" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="365" cy="275" r="6" fill="#10b981" stroke="#fff" stroke-width="2" />

  <!-- HIGH-TECH PRECISION AGRI DRONE (Top-Down Quadcopter at X:365, Y:160) -->
  <g transform="translate(365, 160)">
    <!-- Drone Rotor Blurs -->
    <circle cx="-32" cy="-32" r="22" fill="url(#rotorSpin)" stroke="#34d399" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="32" cy="-32" r="22" fill="url(#rotorSpin)" stroke="#34d399" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="-32" cy="32" r="22" fill="url(#rotorSpin)" stroke="#34d399" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="32" cy="32" r="22" fill="url(#rotorSpin)" stroke="#34d399" stroke-width="1" stroke-dasharray="8 6" />

    <!-- Carbon Fiber Quad Arms -->
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#042217" stroke-width="6.5" stroke-linecap="round" />
    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#042217" stroke-width="6.5" stroke-linecap="round" />
    <line x1="-28" y1="-28" x2="28" y2="28" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <line x1="28" y1="-28" x2="-28" y2="28" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

    <!-- Motor Hubs & Rotor Blades -->
    <circle cx="-32" cy="-32" r="6" fill="#042217" stroke="#dfa41f" stroke-width="2" />
    <circle cx="32" cy="-32" r="6" fill="#042217" stroke="#dfa41f" stroke-width="2" />
    <circle cx="-32" cy="32" r="6" fill="#042217" stroke="#dfa41f" stroke-width="2" />
    <circle cx="32" cy="32" r="6" fill="#042217" stroke="#dfa41f" stroke-width="2" />

    <!-- Central Body Frame -->
    <polygon points="0,-16 16,0 0,16 -16,0" fill="#083c29" stroke="#34d399" stroke-width="2" />
    <circle cx="0" cy="0" r="10" fill="#042217" stroke="#dfa41f" stroke-width="2.5" />
    <circle cx="0" cy="0" r="4.5" fill="#10b981" />

    <!-- Navigation LED status lights -->
    <circle cx="-14" cy="-3" r="2.5" fill="#d11a33" />
    <circle cx="14" cy="-3" r="2.5" fill="#10b981" />

    <!-- Drone Label Callout Box -->
    <g transform="translate(45, -30)">
      <line x1="-45" y1="30" x2="0" y2="10" stroke="#dfa41f" stroke-width="1.5" />
      <rect x="0" y="0" width="160" height="34" rx="6" fill="rgba(4,34,23,0.92)" stroke="#dfa41f" stroke-width="1.5" />
      <text x="10" y="16" fill="#dfa41f" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">
        DRONE AG-X9 ACTIVE
      </text>
      <text x="10" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">
        NDVI SCAN: 0.88 OK
      </text>
    </g>
  </g>

  <!-- Field Markers and Telemetry -->
  <g>
    <circle cx="295" cy="265" r="22" fill="url(#nodePulse)" />
    <circle cx="295" cy="265" r="5" fill="#dfa41f" stroke="#042217" stroke-width="2" />
  </g>
  <circle cx="410" cy="240" r="4" fill="#fff" stroke="#042217" stroke-width="1.6" opacity="0.92" />
  <circle cx="430" cy="320" r="4" fill="#fff" stroke="#042217" stroke-width="1.6" opacity="0.92" />

  <g font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700">
    <rect x="238" y="338" width="150" height="26" rx="8" fill="rgba(4,34,23,0.92)" stroke="#34d399" stroke-width="1.2" />
    <text x="313" y="355" text-anchor="middle" fill="#fff" font-size="11" letter-spacing="1">
      BLOCK 12 &#183; 84 DKA
    </text>
  </g>

  <!-- Compass -->
  <g transform="translate(540,40)" font-family="'Space Grotesk', system-ui, sans-serif">
    <circle r="16" fill="rgba(4,34,23,0.88)" stroke="#34d399" stroke-width="1.5" />
    <polygon points="0,-10 4.5,4 0,1 -4.5,4" fill="#dfa41f" />
    <text y="21" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">N</text>
  </g>

  <!-- Scale Bar -->
  <g transform="translate(30,365)">
    <rect x="0" y="0" width="90" height="6" rx="3" fill="rgba(4,34,23,0.85)" />
    <rect x="0" y="0" width="45" height="6" rx="3" fill="#dfa41f" />
    <text x="0" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#042217">0   200m</text>
  </g>

  <rect width="600" height="400" fill="url(#grain)" />
  <rect width="600" height="400" fill="url(#vignette)" />
</svg>
