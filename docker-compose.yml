# Пример: стартиране зад nginx или директно на порт 3001
services:
  agrinexus-geo:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      # Зад HTTPS reverse proxy (за sitemap/robots и др.):
      # PUBLIC_HTTPS: "1"
      # PUBLIC_ORIGIN: "https://your-domain.example"
      # LLM / embeddings — виж .env.example
    volumes:
      # Запазване на JSON базата и качени файлове между рестарти
      - geo-data:/app/data
      - geo-uploads:/app/uploads

volumes:
  geo-data:
  geo-uploads:
